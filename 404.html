<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
        .error-wrapper {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 48px 0;
        }
        .error-card {
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 24px;
          padding: 48px 40px;
          max-width: 440px;
          width: 90%;
          text-align: center;
          box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
        }
        .error-code {
          color: var(--accent);
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          margin-bottom: 8px;
          display: block;
        }
        h1 {
          font-size: 24px;
          margin: 0 0 12px;
          letter-spacing: -0.5px;
        }
        p {
          color: var(--text-muted);
          font-size: 15px;
          line-height: 1.6;
          margin: 0 0 32px;
        }
    </style>
</head>
<body>

<div id="global-nav-mount"></div>

<div class="error-wrapper">
    <div class="error-card">
        <span class="error-code">404 Error</span>
        <h1>Page Not Found</h1>
        <p>The page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
        <a href="/" class="btn-primary" style="justify-content: center;">Return to Home</a>
    </div>
</div>

<div id="global-footer-mount"></div>

<script src="/assets/js/layout.js"></script>
</body>
</html>
