<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy — QRtz</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
        .legal-wrapper {
          padding: 64px 0 96px;
          max-width: 760px;
        }

        .legal-header {
          border-bottom: 1px solid var(--border);
          padding-bottom: 32px;
          margin-bottom: 40px;
        }

        .legal-badge {
          display: inline-block;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.8px;
          text-transform: uppercase;
          color: var(--accent);
          margin-bottom: 12px;
        }

        .legal-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 20px 32px;
          margin-top: 20px;
          padding: 16px 20px;
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          font-size: 13px;
          color: var(--text-muted);
        }

        .legal-meta strong {
          color: var(--text-main);
        }

        .legal-meta a {
          color: var(--accent);
          text-decoration: none;
        }

        .legal-meta a:hover {
          text-decoration: underline;
        }

        .legal-section {
          margin-bottom: 48px;
        }

        .legal-section h2 {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.3px;
          margin-bottom: 16px;
          color: var(--text-main);
        }

        .legal-section p {
          color: var(--text-muted);
          font-size: 15px;
          margin-bottom: 16px;
        }

        .legal-section ul,
        .legal-section ol {
          margin: 0 0 16px 0;
          padding-left: 20px;
          color: var(--text-muted);
          font-size: 15px;
          line-height: var(--leading-relaxed);
        }

        .legal-section li {
          margin-bottom: 8px;
        }

        .legal-section li strong {
          color: var(--text-main);
        }

        .legal-divider {
          height: 1px;
          background: var(--border);
          border: none;
          margin: 40px 0;
        }

        .contact-box {
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 24px;
          margin-top: 16px;
        }

        .contact-box p {
          margin: 0;
          font-size: 14px;
        }

        .contact-box a {
          color: var(--accent);
          text-decoration: none;
          font-weight: 600;
        }

        .contact-box a:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body data-surface="light" data-accent="rose">

<div id="global-nav-mount"></div>

<main class="shell-container legal-wrapper">
    <header class="legal-header">
        <span class="legal-badge">Privacy policy</span>
        <h1>QRtz</h1>

        <div class="legal-meta">
            <div><strong>Effective Date:</strong> August 01, 2020</div>
            <div><strong>Developer:</strong> 253°Below (Daniel J)</div>
            <div><strong>Contact:</strong> <a href="mailto:info+qrtz@253below.com">info+qrtz@253below.com</a></div>
        </div>
    </header>

    <article>

    </article>
</main>

<div id="global-footer-mount"></div>

<script src="/assets/js/layout.js"></script>
</body>
</html>
