<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SpoDJ</title>

    <!-- iOS / iPadOS Standalone Full-Screen Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SpoDJ" />

    <!-- Home Screen Icon & Manifest (point to your app's actual assets) -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cudajo.github.io/spodj_web-public/assets/icons/spodj-icon-180.png" />
    <link rel="manifest" href="/spodj/manifest.json" />

    <style>
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100dvh; /* Dynamic viewport height prevents iPad Safari bottom-bar clipping */
          background-color: #000000;
          overflow: hidden;
        }

        iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: none;
        }
    </style>
</head>
<body>
<iframe
        src="https://cudajo.github.io/spodj_web-public/"
        allow="autoplay; fullscreen; clipboard-read; clipboard-write"
        allowfullscreen>
</iframe>
</body>
</html>
